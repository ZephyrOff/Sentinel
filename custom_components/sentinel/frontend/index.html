<title>Sentinel</title>
<style>
/* Layout: sidebar (étages, pièces, capteurs) + scène 3D / éditeur de plan + journal en bas */
:root{
  --bg:#eceff3; --surface:#ffffff; --surface2:#f4f6f9; --line:#d8dde5;
  --fg:#131821; --muted:#59636f; --accent:#2457e6; --accent-fg:#ffffff;
  --idle:#8591a2; --ok:#2c8a57; --warn:#c07408; --alarm:#d3302c;
  --scene-bg:#e3e7ed; --scene-slab:#c4ccd8; --scene-wall:#7d8898; --scene-frame:#46505f; --scene-furn:#b8a68c; --scene-grass:#a9c79a; --scene-paving:#d0cbc0; --scene-furn-door:#d6c8b0;
  --font-ui:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1016; --surface:#141a22; --surface2:#1a222c; --line:#27313d;
    --fg:#e6eaf0; --muted:#8b96a5; --accent:#6f95ff; --accent-fg:#0b1020;
    --idle:#667286; --ok:#4cc38a; --warn:#e9a53b; --alarm:#ff5b56;
    --scene-bg:#090c11; --scene-slab:#2b3541; --scene-wall:#6c7a8e; --scene-frame:#aab6c8; --scene-furn:#5b5346; --scene-grass:#25422d; --scene-paving:#3a3e45; --scene-furn-door:#7d735f;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1016; --surface:#141a22; --surface2:#1a222c; --line:#27313d;
  --fg:#e6eaf0; --muted:#8b96a5; --accent:#6f95ff; --accent-fg:#0b1020;
  --idle:#667286; --ok:#4cc38a; --warn:#e9a53b; --alarm:#ff5b56;
  --scene-bg:#090c11; --scene-slab:#2b3541; --scene-wall:#6c7a8e; --scene-frame:#aab6c8; --scene-furn:#5b5346; --scene-grass:#25422d; --scene-paving:#3a3e45; --scene-furn-door:#7d735f;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:14px;line-height:1.4}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* header */
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:.02em}
.brand img{height:30px;width:auto;display:block}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:6px;color:var(--muted);font-weight:500;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 0 0 1px var(--line)}
.seg.armed button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);box-shadow:none}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;font-weight:600;border:1px solid var(--line);background:var(--surface2)}
.pill i{width:9px;height:9px;border-radius:50%;background:var(--ok)}
.pill.warn i{background:var(--warn)} .pill.alarm{border-color:var(--alarm);color:var(--alarm)} .pill.alarm i{background:var(--alarm);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* main */
.main{display:grid;grid-template-columns:minmax(260px,330px) minmax(0,1fr);min-height:0}
.side{overflow:auto;background:var(--surface);border-right:1px solid var(--line);padding:14px 16px 24px;display:flex;flex-direction:column;gap:16px}
.stage{display:grid;grid-template-rows:minmax(0,1fr) 150px;min-height:0;min-width:0}
.view{position:relative;min-height:0;min-width:0;background:var(--scene-bg)}
[hidden]{display:none!important}
#scene{position:absolute;inset:0;touch-action:none}
#scene canvas{display:block;width:100%;height:100%}

.floors{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.frow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface2)}
.frow[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.frow b{font-weight:600}.frow small{color:var(--muted);display:block}
.dot{width:9px;height:9px;border-radius:50%;background:var(--idle);flex:none}
.dot.active{background:var(--warn)}.dot.sense{background:var(--accent)}.dot.alarm{background:var(--alarm)}
.room{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:8px}
.room.sel{border-color:var(--accent)}
.rhead{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;background:var(--surface2);border:0;text-align:left;font-weight:600}
.rhead span.n{margin-left:auto;color:var(--muted);font-weight:400;font-size:12px}
.ent{display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:8px;width:100%;padding:7px 10px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left}
.ent:hover{background:var(--surface2)}
.ent .g{font-family:var(--font-mono);font-size:11px;font-weight:500;width:26px;height:22px;display:grid;place-items:center;border-radius:5px;border:1px solid var(--line);color:var(--muted)}
.ent .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ent .st{font-size:12px;color:var(--muted);text-align:right}
.ent.s-active .st{color:var(--warn)} .ent.s-sense .st{color:var(--accent)} .ent.s-alarm .st{color:var(--alarm);font-weight:600}
.ent.s-active .g{border-color:var(--warn);color:var(--warn)} .ent.s-sense .g{border-color:var(--accent);color:var(--accent)} .ent.s-alarm .g{border-color:var(--alarm);background:var(--alarm);color:#fff}
.ent.sel{box-shadow:inset 3px 0 0 var(--accent)}

/* overlays on the 3D view */
.ov{position:absolute;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ov.tl{top:12px;left:12px;right:12px}
.ov.bl{bottom:12px;left:12px}
.ov.br{bottom:12px;right:12px}
.chip{border:1px solid var(--line);background:var(--surface);padding:6px 11px;border-radius:999px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.chip.ghost{color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.range{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.range input{width:120px;accent-color:var(--accent)}
#tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.18);transform:translate(12px,12px);white-space:nowrap}
#tip b{display:block;font-size:13px}

/* editor */
#editor{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr) 250px;grid-template-rows:auto minmax(0,1fr)}
.tb{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.btn{border:1px solid var(--line);background:var(--surface2);padding:6px 12px;border-radius:8px;font-weight:500}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.dng{color:var(--alarm);border-color:var(--alarm);background:transparent}
.plan{overflow:auto;padding:16px}
#plan{display:block;touch-action:none;user-select:none;background:var(--surface);border:1px solid var(--line);border-radius:6px}
#plan .gl{fill:none;stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke}
#plan .proom{fill:var(--surface2);stroke:var(--scene-wall);stroke-width:2;vector-effect:non-scaling-stroke;cursor:move}
#plan .proom.sel{stroke:var(--accent);fill:color-mix(in srgb,var(--accent) 10%,var(--surface2))}
#plan .ghost{fill:none;stroke:var(--idle);stroke-dasharray:5 4;stroke-width:1;vector-effect:non-scaling-stroke;pointer-events:none;opacity:.7}
#plan .vx{fill:var(--surface);stroke:var(--accent);stroke-width:2;vector-effect:non-scaling-stroke;cursor:grab}
#plan .vx:hover,#plan .vx.sel{fill:var(--accent)}
#plan .mid{fill:var(--accent);opacity:.35;cursor:copy}
#plan .mid:hover{opacity:1}
#plan text.el{font-size:.24px;fill:var(--muted);text-anchor:middle}
#plan .rn,#plan .rs{text-anchor:middle}
.tpl{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#plan .pfurn rect{fill:var(--surface2);stroke:var(--idle);stroke-width:1.5;vector-effect:non-scaling-stroke;cursor:grab}
#plan .pfurn .fr{fill:none;stroke:var(--fg);stroke-width:3;vector-effect:non-scaling-stroke;pointer-events:none}
#plan .pfurn text{font-family:var(--font-mono);font-size:.26px;font-weight:500;text-anchor:middle;dominant-baseline:central}
#plan .pfurn.s-active rect{stroke:var(--warn);fill:color-mix(in srgb,var(--warn) 18%,var(--surface2))}
#plan .pfurn.s-alarm rect{stroke:var(--alarm);fill:color-mix(in srgb,var(--alarm) 20%,var(--surface2))}
#plan .pfurn.sel rect{stroke:var(--accent)}
#plan .proom.out{stroke-dasharray:6 4}
#plan .proom.grs{fill:color-mix(in srgb,var(--ok) 16%,var(--surface))}
#plan .proom.pav{fill:color-mix(in srgb,var(--idle) 14%,var(--surface))}
#plan .proom.out.sel{stroke:var(--accent)}
.tag{margin-left:6px;font-family:var(--font-mono);font-size:10px;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.chk{flex-direction:row!important;align-items:center;gap:8px!important;color:var(--fg)!important}
.chk input{width:auto}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#plan .proom{stroke:var(--idle);stroke-width:1;stroke-dasharray:4 3}
#plan .proom.sel{stroke-dasharray:none;stroke-width:2}
#plan .wl{fill:none;stroke:var(--scene-wall);stroke-width:4;stroke-linecap:square;vector-effect:non-scaling-stroke;pointer-events:none}
#plan .gap{fill:var(--surface);stroke:none}
#plan .pop path{fill:none;stroke:var(--fg);stroke-width:1.5;vector-effect:non-scaling-stroke}
#plan .pop .sw{stroke-dasharray:3 3;stroke-width:1.2}
#plan .pop .hit{fill:transparent;stroke:none;cursor:ew-resize}
#plan .pop.s-active path{stroke:var(--warn)}
#plan .pop.s-alarm path{stroke:var(--alarm)}
#plan .pop.sel .gap{fill:color-mix(in srgb,var(--accent) 25%,var(--surface))}
#plan .pop.sel path{stroke:var(--accent)}
#plan .pent circle{fill:var(--surface);stroke:var(--idle);stroke-width:2;vector-effect:non-scaling-stroke;cursor:grab}
#plan .pent.sel circle{stroke:var(--accent);fill:color-mix(in srgb,var(--accent) 18%,var(--surface))}
#plan text{fill:var(--fg);font-family:var(--font-ui);pointer-events:none}
#plan .pent text{font-family:var(--font-mono);font-size:.3px;font-weight:500;text-anchor:middle;dominant-baseline:central}
#plan .rn{font-size:.38px;font-weight:600}
#plan .rs{font-size:.28px;fill:var(--muted)}
.insp{background:var(--surface);border-left:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.insp label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.insp input,.insp select,.tb select{background:var(--surface2);border:1px solid var(--line);border-radius:7px;padding:6px 8px;color:var(--fg)}
.insp .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.insp p{color:var(--muted);margin:0}

/* journal */
.log{background:var(--surface);border-top:1px solid var(--line);padding:10px 16px;overflow:auto}
.log ol{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:12.5px}
.log li{display:flex;gap:10px;align-items:baseline}
.log time{color:var(--muted);font-family:var(--font-mono);font-size:12px}
.log li.alarm{color:var(--alarm);font-weight:600}

.seg button i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;background:var(--idle)}
.pill.info i{background:var(--accent)}
.log li.lv-critical{color:var(--alarm);font-weight:600}
.log li.lv-warning{color:var(--warn)}
.log li.lv-info{color:var(--accent)}
.log .note{display:block;color:var(--muted);font-weight:400;font-family:var(--font-mono);font-size:11.5px}
.main.wide{grid-template-columns:minmax(0,1fr)}
.main.wide .side{display:none}
#config{position:absolute;inset:0;overflow:auto;background:var(--bg);padding:20px 16px 40px}
#config h2{margin:0 0 4px;font-size:17px}
#config p{margin:0 0 12px;color:var(--muted);max-width:75ch}
#config textarea{width:100%;min-height:200px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px;font-family:var(--font-mono);font-size:12px;color:var(--fg)}
.cfg-head{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:6px}
.mcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px;margin:12px 0 28px}
.mcard{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--mc,var(--idle));border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.mcard.act{box-shadow:0 0 0 1px var(--accent)}
.mcard header{display:flex;align-items:center;gap:8px}
.mcard header input[type=color]{width:34px;height:30px;padding:0;border:1px solid var(--line);border-radius:6px;background:transparent;flex:none}
.mcard .mname{font-weight:600;font-size:15px;flex:1;min-width:0}
.mcard label,.hacard label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.mcard input,.mcard select,.hacard input,.mx input,.hat input{background:var(--surface2);border:1px solid var(--line);border-radius:7px;padding:6px 8px;color:var(--fg);min-width:0}
.mcard .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mcard fieldset{border:1px solid var(--line);border-left:4px solid var(--idle);border-radius:8px;margin:0;padding:6px 10px 10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.mcard fieldset.lv-info{border-left-color:var(--accent)}
.mcard fieldset.lv-warning{border-left-color:var(--warn)}
.mcard fieldset.lv-critical{border-left-color:var(--alarm)}
.mcard fieldset legend{padding:0 6px}
.mcard footer{display:flex;gap:8px;flex-wrap:wrap}
.rules{display:flex;flex-direction:column;gap:6px}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) 120px 26px;gap:8px;align-items:center;font-size:13px}
.rrow>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow small{color:var(--muted);margin-left:4px}
.rrow .kd{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:6px;font-weight:600}
.rrow .g{font-family:var(--font-mono);font-size:11px;border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-right:6px;color:var(--muted)}
.rrow .x{border:1px solid var(--line);background:transparent;border-radius:6px;height:26px;width:26px;color:var(--muted)}
.rules select{background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:5px 6px;color:var(--fg);min-width:0}
.rules select.lvl{border-left-width:5px;width:100%}
.rules select.lv-off{border-left-color:var(--idle)}
.rules select.lv-info{border-left-color:var(--accent)}
.rules select.lv-warning{border-left-color:var(--warn)}
.rules select.lv-critical{border-left-color:var(--alarm)}
.radd{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px;padding-top:8px;border-top:1px dashed var(--line)}
.radd .btn{grid-column:1/-1}
.rules .hint{font-size:12px;margin:0}
.tag.act{color:var(--accent);border-color:var(--accent)}
.mxwrap{overflow:auto;border:1px solid var(--line);border-radius:10px;max-height:70vh;background:var(--surface)}
.mx{border-collapse:separate;border-spacing:0;min-width:100%}
.mx th,.mx td{padding:6px 10px;border-bottom:1px solid var(--line);background:var(--surface);text-align:left;font-weight:400}
.mx thead th{position:sticky;top:0;z-index:3;font-weight:600;min-width:180px}
.mx th.rl{position:sticky;left:0;z-index:2;min-width:240px;border-right:1px solid var(--line)}
.mx thead th.rl{z-index:4}
.mx tr.sec th{background:var(--surface2);position:sticky;left:0}
.mx .sbtn{border:0;background:transparent;font-weight:600;padding:0}
.mx .mdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px}
.mx select.lvl{width:100%;border:1px solid var(--line);border-left-width:5px;border-radius:6px;padding:5px 6px;background:var(--surface2)}
.mx select.lvl.lv-off{border-left-color:var(--idle)}
.mx select.lvl.lv-info{border-left-color:var(--accent)}
.mx select.lvl.lv-warning{border-left-color:var(--warn)}
.mx select.lvl.lv-critical{border-left-color:var(--alarm)}
.mx select.lvl.inh{color:var(--muted);font-style:italic}
.mx .g{font-family:var(--font-mono);font-size:11px;border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-right:8px;color:var(--muted)}
.mx small{color:var(--muted);margin-left:6px}
.hacard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;margin:12px 0;max-width:520px}
.hat{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.hat th,.hat td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-weight:400}
.hat thead th{background:var(--surface2);font-weight:600}
.hat tr.off td{opacity:.45}
.hat .eid{display:flex;align-items:center;gap:0;font-family:var(--font-mono);font-size:12.5px;flex-wrap:nowrap}
.hat .eid span{color:var(--muted);white-space:nowrap}
.hat .eid input{flex:1;min-width:120px;font-family:var(--font-mono);font-size:12.5px;padding:3px 6px}
.hat .st{display:inline-block;padding:1px 8px;border-radius:999px;border:1px solid var(--line);font-family:var(--font-mono);font-size:12px}
.hat .st.lv-critical{color:var(--alarm);border-color:var(--alarm)}
.hat .st.lv-warning{color:var(--warn);border-color:var(--warn)}
.hat .st.lv-info{color:var(--accent);border-color:var(--accent)}
.hat .at{font-family:var(--font-mono);font-size:11.5px;color:var(--muted);word-break:break-word}
.hat .ds{color:var(--muted);font-size:12.5px;max-width:42ch}
.hatw{overflow:auto}
pre.yaml{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto;font-family:var(--font-mono);font-size:12px;margin:0 0 12px}
#config .muted{color:var(--muted);font-size:12px}
.mlayout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
.mlist{display:flex;flex-direction:column;gap:6px;position:sticky;top:0}
.mitem{display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);width:100%}
.mitem.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.mitem i{width:10px;height:10px;border-radius:50%;flex:none}
.mitem span{min-width:0;flex:1}
.mitem b{display:block;font-weight:600}
.mitem small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mitem em{font-style:normal}
.mdetail{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.mdhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 16px 0}
.mdtitle{display:flex;align-items:center;gap:10px}
.mdtitle i{width:12px;height:12px;border-radius:50%}
.mdtitle h2{margin:0;font-size:19px}
.mtabs{display:flex;gap:2px;padding:10px 16px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.mtabs button{border:0;background:transparent;padding:8px 12px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.mtabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.mbody{padding:16px}

/* ---------- adaptateur Home Assistant ---------- */
var API=(function(){
  var a={hass:null,onSnapshot:null,timer:null,pending:null};
  window.sentinelOnHass=function(h){a.hass=h};
  /* Attend que le panneau parent fournisse l'objet hass ; null = mode démo autonome. */
  a.waitHass=function(){return new Promise(function(res){
    if(window.parent===window){res(null);return}
    var t=0;
    (function poll(){
      if(window.sentinelHass){a.hass=window.sentinelHass;res(a.hass);return}
      t+=50;if(t>3000){res(null);return}
      setTimeout(poll,50);
    })();
  })};
  a.load=function(){return a.hass.callWS({type:'sentinel/get_config'})};
  a._send=function(){
    var m=a.pending;a.pending=null;clearTimeout(a.timer);a.timer=null;
    if(!m)return Promise.resolve();
    return a.hass.callWS({type:'sentinel/save_config',config:m}).catch(function(e){console.error('Sentinel : sauvegarde impossible',e)});
  };
  a.save=function(model){a.pending=model;clearTimeout(a.timer);a.timer=setTimeout(a._send,500)};
  a.setMode=function(id){return a._send().then(function(){return a.hass.callService('sentinel','set_mode',{mode:id})})};
  a.subscribe=function(cb){return a.hass.connection.subscribeMessage(cb,{type:'sentinel/subscribe'})};
  a.moreInfo=function(entityId){
    try{
      var ha=window.parent.document.querySelector('home-assistant');
      if(ha)ha.dispatchEvent(new CustomEvent('hass-more-info',{detail:{entityId:entityId},bubbles:true,composed:true}));
    }catch(e){}
  };
  a.entityIds=function(){
    if(!a.hass)return [];
    return Object.keys(a.hass.states).filter(function(id){
      return /^(binary_sensor|cover|lock|input_boolean|switch)\./.test(id);
    }).sort();
  };
  return a;
})();

var live=null;

/* ---------- géométrie des pièces ----------
   room.pts = polygone [[x,z],…] en m ; room.wl[i] = 1 si l'arête i (pts[i] → pts[i+1]) porte un mur
   (ou une clôture en extérieur). x,z,w,d restent la boîte englobante, recalculée par bboxSync().
   ouverture : room + edge (index d'arête) + off (m depuis le début de l'arête). */
function rectPts(x,z,w,d){return [[x,z],[x+w,z],[x+w,z+d],[x,z+d]]}
function ptsArea(p){var a=0;for(var i=0;i<p.length;i++){var q=p[(i+1)%p.length];a+=p[i][0]*q[1]-q[0]*p[i][1]}return a/2}
function bboxSync(r){
  var x0=1e9,z0=1e9,x1=-1e9,z1=-1e9;
  r.pts.forEach(function(p){x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);z0=Math.min(z0,p[1]);z1=Math.max(z1,p[1])});
  r.x=x0;r.z=z0;r.w=x1-x0;r.d=z1-z0;
}
function inPoly(p,x,z){
  var c=false,n=p.length,E=1e-9;
  for(var i=0,j=n-1;i<n;j=i++){
    var a=p[i],b=p[j];
    var cr=(b[0]-a[0])*(z-a[1])-(b[1]-a[1])*(x-a[0]);
    if(Math.abs(cr)<E&&x>=Math.min(a[0],b[0])-E&&x<=Math.max(a[0],b[0])+E&&z>=Math.min(a[1],b[1])-E&&z<=Math.max(a[1],b[1])+E)return true;
    if((a[1]>z)!==(b[1]>z)&&x<(b[0]-a[0])*(z-a[1])/(b[1]-a[1])+a[0])c=!c;
  }
  return c;
}
/* arêtes : départ a, fin b, longueur, vecteur u, normale n orientée vers l'intérieur, angle phi (rotation Y three.js) */
function roomEdges(r){
  var p=r.pts,n=p.length,sg=ptsArea(p)<0?-1:1,out=[];
  for(var i=0;i<n;i++){
    var a=p[i],b=p[(i+1)%n],dx=b[0]-a[0],dz=b[1]-a[1],len=Math.hypot(dx,dz),l=len||1e-9,ux=dx/l,uz=dz/l;
    out.push({ax:a[0],az:a[1],bx:b[0],bz:b[1],len:len,ux:ux,uz:uz,nx:-uz*sg,nz:ux*sg,phi:-Math.atan2(uz,ux)});
  }
  return out;
}
function isRect(r){
  if(r.pts.length!==4)return false;
  return r.pts.every(function(a,i){var b=r.pts[(i+1)%4];return Math.abs(a[0]-b[0])<1e-6||Math.abs(a[1]-b[1])<1e-6});
}
function labelPt(r){
  var p=r.pts,a=0,cx=0,cz=0,i,q,c;
  for(i=0;i<p.length;i++){q=p[(i+1)%p.length];c=p[i][0]*q[1]-q[0]*p[i][1];a+=c;cx+=(p[i][0]+q[0])*c;cz+=(p[i][1]+q[1])*c}

/* Murs réels : segments pleins autour des ouvertures (allège + linteau), puis cadre et vantail par ouverture */
var WT=0.1,FENCE_H=1.1;
/* arêtes qui ont un mur (ou une clôture en extérieur) : r.wl[i] ; les autres sont ouvertes */
function wallPath(r){
  return roomEdges(r).map(function(g,i){return r.wl[i]?'M'+g.ax+' '+g.az+'L'+g.bx+' '+g.bz:''}).join('');
}
function wallBox(g,mat,ed,a,b,y0,y1){
  if(b-a<0.01||y1-y0<0.01)return;
  var m=new THREE.Mesh(new THREE.BoxGeometry(b-a,y1-y0,WT),mat),c=(a+b)/2;
  m.position.set(ed.ax+ed.ux*c+ed.nx*WT/2,(y0+y1)/2,ed.az+ed.uz*c+ed.nz*WT/2);
  m.rotation.y=ed.phi;
  g.add(m);
}
function buildWalls(g,r,f,mat,dim){
  var ops=model.ents.filter(function(e){return e.room&&e.floor===f.id});
  var H=r.outdoor?FENCE_H:WALL_H;
  roomEdges(r).forEach(function(w,i){
    if(w.len<0.01)return;
    if(!r.wl[i]){ // côté ouvert : simple repère au sol entre deux zones
      var thin=new THREE.Mesh(new THREE.BoxGeometry(w.len,0.03,0.05),
        new THREE.MeshBasicMaterial({color:css('--scene-wall'),transparent:true,opacity:dim?0.1:0.7}));
      thin.position.set((w.ax+w.bx)/2,0.09,(w.az+w.bz)/2);thin.rotation.y=w.phi;
      g.add(thin);
      return;
    }
    // ouvertures posées sur cette arête (y compris celles de la pièce voisine, sur le même mur)
    var here=[];
    ops.forEach(function(o){
      var rr=model.rooms.find(function(x){return x.id===o.room}),oe=rr&&roomEdges(rr)[o.edge];
      if(!oe||Math.abs(oe.ux*w.uz-oe.uz*w.ux)>0.01)return;
      var rx=o.x-w.ax,rz=o.z-w.az,t=rx*w.ux+rz*w.uz;
      if(Math.abs(rx*w.nx+rz*w.nz)<=0.02&&t>=0&&t<=w.len)here.push({o:o,t:t});
    });
    here.sort(function(p,q){return p.t-q.t});
    var cur=0;
    here.forEach(function(h){
      var o=h.o,T=TYPES[o.type],ow=o.w||T.w;
      var lo=Math.max(cur,h.t-ow/2),hi=Math.min(w.len,h.t+ow/2);
      wallBox(g,mat,w,cur,lo,0,H);
      if(T.sill>0)wallBox(g,mat,w,lo,hi,0,Math.min(T.sill,H));
      wallBox(g,mat,w,lo,hi,Math.min(T.sill+T.h,H),H);
      cur=hi;
      if(o.room===r.id&&o.edge===i&&!dim)buildOpening(g,o,w,ow,H);
    });
    wallBox(g,mat,w,cur,w.len,0,H);
  });
}
function buildOpening(g,o,w,ow,H){

  var frameMat=new THREE.MeshLambertMaterial({color:col,emissive:s==='idle'?0x000000:col,emissiveIntensity:s==='idle'?0:0.45});
  var y0=T.sill,y1=Math.min(T.sill+T.h,H),ft=0.06;
  // repère local : x le long du mur, z = épaisseur ; l'axe z local vaut la normale intérieure si le polygone est horaire
  var sg=(w.nx*(-w.uz)+w.nz*w.ux)>0?1:-1;
  var grp=new THREE.Group();
  grp.position.set(o.x+w.nx*WT/2,0,o.z+w.nz*WT/2);grp.rotation.y=w.phi;
  g.add(grp);
  function bar(dx,dy,sx,sy){
    var m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,WT*1.15),frameMat);
    m.position.set(dx,dy,0);grp.add(m);
  }
  bar(0,y1-ft/2,ow,ft);                       // linteau
  if(y0>0)bar(0,y0+ft/2,ow,ft);               // appui
  bar(-ow/2+ft/2,(y0+y1)/2,ft,y1-y0);         // montants
  bar(ow/2-ft/2,(y0+y1)/2,ft,y1-y0);
  // vantail : pivot sur le montant de départ, bascule vers l'intérieur de la pièce quand c'est ouvert
  var leafH=y1-y0-2*ft,leafW=ow-2*ft;
  var pivot=new THREE.Group();
  pivot.position.set(-ow/2+ft,y0+ft,0);
  grp.add(pivot);
  var glass=T.glass;
  var lm=glass
    ? new THREE.MeshLambertMaterial({color:s==='idle'?0x8fb8ff:col,transparent:true,opacity:0.32,depthWrite:false})
    : new THREE.MeshLambertMaterial({color:col});
  var leaf=new THREE.Mesh(new THREE.BoxGeometry(leafW,leafH,0.05),lm);
  if(o.type==='garage'){
    // sectionnelle : remonte sous le plafond quand elle est ouverte
    leaf.position.set(leafW/2,leafH/2+(o.on?leafH*0.88:0),0);
    if(o.on)leaf.scale.y=0.12,leaf.position.y=leafH-0.08;
    pivot.add(leaf);
  }else{
    leaf.position.set(leafW/2,leafH/2,0);
    pivot.add(leaf);
    var ang=o.on?(o.type==='window'?0.9:1.3):0;
    pivot.rotation.y=-sg*ang;
  }
  if(o.type==='door'){ // poignée
    var hd=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.05,0.09),frameMat);
    hd.position.set(leafW-0.12,leafH*0.48,0);pivot.add(hd);
  }
}

/* Meuble : caisson + portes battantes (1 ou 2) qui s'ouvrent vers l'avant quand le capteur est actif */
var FACE_ROT={S:0,N:Math.PI,E:Math.PI/2,W:-Math.PI/2};
function buildFurniture(g,e){
  var T=TYPES[e.type],s=sev(e),w=e.w||T.w,d=e.d||T.d,h=e.h||T.h,el=T.elev||0;
  var col=new THREE.Color(css(s==='idle'?'--scene-furn-door':sevVar(s)));
  var grp=new THREE.Group();
  grp.position.set(e.x,0,e.z);grp.rotation.y=FACE_ROT[e.face||'S'];g.add(grp);
  var body=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color:css('--scene-furn')}));
  body.position.y=el+h/2;grp.add(body);
  if(e.on){ // intérieur visible
    var cav=new THREE.Mesh(new THREE.PlaneGeometry(w-0.05,h-0.05),new THREE.MeshBasicMaterial({color:0x0b0e13}));
    cav.position.set(0,el+h/2,d/2+0.003);grp.add(cav);
  }
  var n=T.doors||1,lw=w/n;
  var mat=new THREE.MeshLambertMaterial({color:col,emissive:s==='idle'?0x000000:col,emissiveIntensity:s==='idle'?0:0.4});
  var hmat=new THREE.MeshLambertMaterial({color:css('--scene-frame')});
  for(var i=0;i<n;i++){
    var dir=(n===1||i===0)?1:-1;
    var px=n===1?-w/2:(i===0?-w/2:w/2);
    var pv=new THREE.Group();pv.position.set(px,el+0.02,d/2+0.012);grp.add(pv);
    var leaf=new THREE.Mesh(new THREE.BoxGeometry(lw-0.03,h-0.04,0.03),mat);
    leaf.position.set(dir*lw/2,(h-0.04)/2,0.015);pv.add(leaf);
    var hd=new THREE.Mesh(new THREE.BoxGeometry(0.03,Math.min(0.18,h*0.3),0.025),hmat);
    hd.position.set(dir*(lw-0.1),h*(h>1.5?0.5:0.7),0.04);pv.add(hd);
    pv.rotation.y=e.on?-dir*1.25:0;
  }
  var hit=new THREE.Mesh(new THREE.SphereGeometry(Math.max(0.55,Math.max(w,h)/2),8,6),new THREE.MeshBasicMaterial({transparent:true,opacity:0,depthWrite:false}));
  hit.position.set(e.x,el+h/2,e.z);hit.userData={ent:e.id};g.add(hit);pickables.push(hit);
  if(s==='alarm'){
    var rg=new THREE.Mesh(new THREE.RingGeometry(0.25,0.32,32),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:0.7,side:THREE.DoubleSide,depthWrite:false}));
    rg.rotation.x=-Math.PI/2;rg.position.set(e.x,0.1,e.z);g.add(rg);pulsers.push({m:null,ring:rg});
  }
}

function build(){
  if(!renderer)return;
  disposeGroup(root);pickables=[];pulsers=[];
  renderer.setClearColor(css('--scene-bg'));
  var cSlab=new THREE.Color(css('--scene-slab')),cWall=css('--scene-wall'),cFg=css('--fg'),cAcc=css('--accent');
  var maxX=0,maxZ=0,maxLvl=0;
  model.rooms.forEach(function(r){maxX=Math.max(maxX,r.x+r.w);maxZ=Math.max(maxZ,r.z+r.d)});
  model.floors.forEach(function(f){maxLvl=Math.max(maxLvl,f.level)});
  var pitch=WALL_H+ui.explode;
  orbit.tx=maxX/2;orbit.tz=maxZ/2;orbit.ty=(maxLvl*pitch+WALL_H)/2-0.3;

  model.floors.forEach(function(f){
    var g=new THREE.Group();g.position.y=f.level*pitch;root.add(g);
    var dim=ui.floor!=='all'&&ui.floor!==f.id;
    model.rooms.filter(function(r){return r.floor===f.id}).forEach(function(r){
      var es=model.ents.filter(function(e){return e.floor===f.id&&roomOf(e)===r});
      var s=worst(es);
      var col=r.outdoor?new THREE.Color(css(r.ground==='paving'?'--scene-paving':'--scene-grass')):cSlab.clone();
      if(s!=='idle')col.lerp(new THREE.Color(css(sevVar(s))),s==='alarm'?0.7:0.45);
      var lp=labelPt(r),rh=r.outdoor?0.08:0.14,shp=new THREE.Shape();
      insetPts(r.pts,0.04).forEach(function(p,k){if(k)shp.lineTo(p[0],p[1]);else shp.moveTo(p[0],p[1])});
      var slab=new THREE.Mesh(new THREE.ExtrudeGeometry(shp,{depth:rh,bevelEnabled:false}),new THREE.MeshLambertMaterial({color:col,transparent:dim,opacity:dim?0.18:1}));
      slab.rotation.x=Math.PI/2;slab.position.y=rh/2;slab.userData={room:r.id};g.add(slab);
      if(!dim)pickables.push(slab);
      var selRoom=ui.sel&&ui.sel.kind==='room'&&ui.sel.id===r.id;
      var wallMat=new THREE.MeshLambertMaterial({color:selRoom?cAcc:cWall,transparent:true,opacity:dim?0.05:(ui.solidWalls?0.92:0.34),depthWrite:ui.solidWalls&&!dim});
      buildWalls(g,r,f,wallMat,dim);
      var lb=labelSprite(r.name,cFg,dim?0.15:0.9);
      lb.position.set(lp.x,0.35,lp.z);g.add(lb);
    });
    if(dim)return;
    model.ents.filter(function(e){return e.floor===f.id&&e.room}).forEach(function(e){
      if(roomOf(e)){var s0=sev(e);
        if(s0==='alarm'){
          var c0=new THREE.Color(css('--alarm'));
          var rg=new THREE.Mesh(new THREE.RingGeometry(0.25,0.32,32),new THREE.MeshBasicMaterial({color:c0,transparent:true,opacity:0.7,side:THREE.DoubleSide,depthWrite:false}));
          rg.rotation.x=-Math.PI/2;rg.position.set(e.x,0.1,e.z);g.add(rg);pulsers.push({m:null,ring:rg});
        }
        var T0=TYPES[e.type],hit0=new THREE.Mesh(new THREE.SphereGeometry(Math.max(0.6,(e.w||T0.w)/2),8,6),new THREE.MeshBasicMaterial({transparent:true,opacity:0,depthWrite:false}));
        hit0.position.set(e.x,T0.sill+T0.h/2,e.z);hit0.userData={ent:e.id};g.add(hit0);pickables.push(hit0);
      }
    });
    model.ents.filter(function(e){return e.floor===f.id&&TYPES[e.type].furniture}).forEach(function(e){
      buildFurniture(g,e);
    });
    model.ents.filter(function(e){return e.floor===f.id&&!e.room&&!TYPES[e.type].furniture}).forEach(function(e){
      var s=sev(e),T=TYPES[e.type],c=new THREE.Color(css(sevVar(s)));
      var m=new THREE.Mesh(markerGeo(e.type),new THREE.MeshLambertMaterial({color:c,emissive:s==='idle'?0x000000:c,emissiveIntensity:s==='idle'?0:0.55}));
      m.position.set(e.x,T.y,e.z);g.add(m);
      var stem=new THREE.Mesh(new THREE.CylinderGeometry(0.015,0.015,T.y,6),new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:0.5}));
      stem.position.set(e.x,T.y/2,e.z);g.add(stem);
      var hit=new THREE.Mesh(new THREE.SphereGeometry(0.55,8,6),new THREE.MeshBasicMaterial({transparent:true,opacity:0,depthWrite:false}));
      hit.position.copy(m.position);hit.userData={ent:e.id};g.add(hit);pickables.push(hit);
      if(s==='alarm'){
        var ring=new THREE.Mesh(new THREE.RingGeometry(0.25,0.32,32),new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:0.7,side:THREE.DoubleSide,depthWrite:false}));
        ring.rotation.x=-Math.PI/2;ring.position.set(e.x,0.1,e.z);g.add(ring);
        pulsers.push({m:m,ring:ring});
      }
    });
  });
  placeCam();
}

/* orbite + sélection */
function bindOrbit(el){
  var pts=new Map(),down=null,pinch=0;
  el.addEventListener('pointerdown',function(ev){
    el.setPointerCapture(ev.pointerId);
    pts.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
    if(pts.size===1)down={x:ev.clientX,y:ev.clientY};
    if(pts.size===2){var a=Array.from(pts.values());pinch=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);down=null}
  });
  el.addEventListener('pointermove',function(ev){
    var p=pts.get(ev.pointerId);
    if(!p){hover(ev);return}
    if(pts.size===1){
      orbit.theta-=(ev.clientX-p.x)*0.0065;
      orbit.phi=Math.min(1.5,Math.max(0.25,orbit.phi-(ev.clientY-p.y)*0.0055));
      hideTip();
    }
    p.x=ev.clientX;p.y=ev.clientY;
    if(pts.size===2){
      var a=Array.from(pts.values()),d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
      if(pinch)orbit.r=Math.min(70,Math.max(8,orbit.r*pinch/d));
      pinch=d;
    }
  });
  function end(ev){
    var moved=down&&Math.hypot(ev.clientX-down.x,ev.clientY-down.y)>5;
    if(down&&!moved&&ev.type==='pointerup')pick(ev,true);
    pts.delete(ev.pointerId);down=null;pinch=0;
  }
  el.addEventListener('pointerup',end);
  el.addEventListener('pointercancel',end);
  el.addEventListener('pointerleave',hideTip);
  el.addEventListener('wheel',function(ev){
    ev.preventDefault();
    orbit.r=Math.min(70,Math.max(8,orbit.r*(1+ev.deltaY*0.0012)));
  },{passive:false});
}
function pickAt(ev){
  var rect=renderer.domElement.getBoundingClientRect();
  var v=new THREE.Vector2(((ev.clientX-rect.left)/rect.width)*2-1,-((ev.clientY-rect.top)/rect.height)*2+1);
  placeCam();cam.updateMatrixWorld();
  raycaster.setFromCamera(v,cam);
  var hits=raycaster.intersectObjects(pickables,false);
  var ent=hits.find(function(h){return h.object.userData.ent});
  if(ent)return {kind:'ent',id:ent.object.userData.ent};
  if(hits.length&&hits[0].object.userData.room)return {kind:'room',id:hits[0].object.userData.room};
  return null;
}
function pick(ev){
  var p=pickAt(ev);
  if(!p){ui.sel=null;renderSide();build();return}
  if(p.kind==='ent'){toggle(p.id);return}
  ui.sel=p;renderSide();build();
  var el=$('.room.sel');if(el&&el.scrollIntoView)el.scrollIntoView({block:'nearest'});
}
function hover(ev){
  var p=pickAt(ev),tip=$('#tip');
  renderer.domElement.style.cursor=p?'pointer':'grab';
  if(!p){tip.hidden=true;return}
  var host=$('#view').getBoundingClientRect();
  if(p.kind==='ent'){
    var e=model.ents.find(function(x){return x.id===p.id}),r=roomOf(e);
    tip.innerHTML='<b>'+esc(e.name)+'</b>'+esc(TYPES[e.type].label)+' · '+esc(stateText(e))+(r?' · '+esc(r.name):'');
  }else{
    var rm=model.rooms.find(function(x){return x.id===p.id});
    var n=model.ents.filter(function(e){return e.floor===rm.floor&&roomOf(e)===rm}).length;
    tip.innerHTML='<b>'+esc(rm.name)+'</b>'+(isRect(rm)?fm(rm.w)+' × '+fm(rm.d)+' m · ':'')+fm(Math.abs(ptsArea(rm.pts)))+' m² · '+n+' capteur'+(n>1?'s':'');
  }
  tip.hidden=false;
  tip.style.left=(ev.clientX-host.left)+'px';tip.style.top=(ev.clientY-host.top)+'px';
}
function hideTip(){$('#tip').hidden=true}

var TPLS={
  rect:[[0,0],[1,0],[1,1],[0,1]],
  L:[[0,0],[0.55,0],[0.55,0.45],[1,0.45],[1,1],[0,1]],
  T:[[0,0],[1,0],[1,0.4],[0.7,0.4],[0.7,1],[0.3,1],[0.3,0.4],[0,0.4]],

function axisLock(a,b){
  var dx=Math.abs(a[0]-b[0]),dz=Math.abs(a[1]-b[1]);
  return dx<1e-6&&dz>1e-6?'v':dz<1e-6&&dx>1e-6?'h':null;
}
function vertexDrag(r,i,p){
  var n=r.pts.length,pts0=copyPts(r.pts),pi=(i+n-1)%n,ni=(i+1)%n;
  return {kind:'vertex',id:r.id,i:i,p0:p,pts0:pts0,lp:axisLock(pts0[pi],pts0[i]),ln:axisLock(pts0[i],pts0[ni]),moved:false};

/* point au milieu d'une arête : en mode angles droits on tire un tronçon du mur (décrochement),
   sinon on ajoute un sommet. Sans mouvement, la modification est annulée. */
function midDrag(r,i,p){
  var ed=roomEdges(r)[i],sn=snapOpenings(r),before={pts:copyPts(r.pts),wl:r.wl.slice()};
  var undo=function(rr){rr.pts=before.pts;rr.wl=before.wl;bboxSync(rr);reattach(rr,sn);syncOpenings()};
  var t1=snap4(ed.len/3),t2=snap4(2*ed.len/3),d;
  if(ui.ortho!==false&&t2-t1>=0.5){
    var P=function(t){return [ed.ax+ed.ux*t,ed.az+ed.uz*t]},v=r.wl[i];
    r.pts.splice(i+1,0,P(t1),P(t1),P(t2),P(t2));
    r.wl.splice(i+1,0,v,v,v,v);
    reattach(r,sn);
    return {kind:'push',id:r.id,p0:p,pts0:copyPts(r.pts),a:i+2,b:i+3,n:[ed.nx,ed.nz],moved:false,undo:undo};
  }

}
function removeVertex(r,i){
  var sn=snapOpenings(r),p0=copyPts(r.pts),w0=r.wl.slice();

      else if(TT.furniture){o.w=TT.w;o.d=TT.d;o.h=TT.h}
    }
    else if(t.id==='fOut'){o.outdoor=t.checked;o.wl=o.pts.map(function(){return 1});if(t.checked)o.ground=o.ground||'grass'}
    else if(t.id==='fGround')o.ground=t.value;
    else if(/^fWal\d+$/.test(t.id)){o.wl[parseInt(t.id.slice(4),10)]=t.checked?1:0}
    else if(t.id==='fEntity')o.entity=t.value.trim();
    else if(t.id==='fInvert')o.invert=t.checked;
    else if(t.id==='fDelay')o.delay=Math.max(0,parseInt(t.value,10)||0);
    else if(t.id==='fFace')o.face=t.value;
    else if(t.id==='fFw')o.w=Math.max(0.2,parseFloat(t.value)||o.w);
    else if(t.id==='fFd')o.d=Math.max(0.1,parseFloat(t.value)||o.d);
    else if(t.id==='fFh')o.h=Math.max(0.2,parseFloat(t.value)||o.h);
    else if(t.id==='fEdge')o.edge=parseInt(t.value,10)||0;
    else if(t.id==='fOff')o.off=parseFloat(t.value)||0;
    else if(t.id==='fWd')o.w=Math.max(0.5,parseFloat(t.value)||o.w);
    else return;
    syncOpenings();
    save();
    var keep=$('#plan').parentNode.scrollLeft;renderEditor();
    // garder le focus dans l'inspecteur
    var again=document.getElementById(t.id);
    if(again&&t.tagName!=='SELECT'){again.focus();try{again.setSelectionRange(again.value.length,again.value.length)}catch(e){}}
    $('#plan').parentNode.scrollLeft=keep;
    renderSide();
  });
}

      return;
    case 'importjson':
      var msg=$('#jsonMsg');
      try{
        var j=JSON.parse($('#jsonIn').value);
        if(!j||!Array.isArray(j.floors)||!Array.isArray(j.rooms)||!Array.isArray(j.ents))throw new Error('il manque floors, rooms ou ents.');
        if(!Array.isArray(j.modes)||!j.modes.length||!j.cfg)throw new Error('il manque modes ou cfg.');
        model=j;if(!modeById(model.mode))model.mode=model.modes[0].id;
        syncOpenings();ui.editFloor=model.floors[0].id;ui.floor='all';
        save();renderHeader();renderSide();renderOverlays();renderConfig();
        $('#jsonMsg').textContent='Configuration appliquée.';
      }catch(err){msg.textContent='Import impossible : '+err.message}
      return;
  }
  save();refresh();
}
function cfgChange(t){
  var d=t.dataset,m=d.mid?modeById(d.mid):null;
  if(d.rk!==undefined){ // le type de cible change : recharger la liste des cibles
    var sel=document.querySelector('[data-rt="'+d.rk+'"]');
    sel.innerHTML=targetOptions(t.value).map(function(o){return '<option value="'+esc(o.v)+'">'+esc(o.t)+'</option>'}).join('');
    return;
  }
  if(d.rt!==undefined||d.rl!==undefined)return;
  if(d.scope&&m){
    var v=t.value;
    if(d.scope==='def')m.def=v||'off';
    else{var bag=m[d.scope]=m[d.scope]||{};if(v)bag[d.key]=v;else delete bag[d.key]}
    save();refresh();return;
  }
  if(d.f&&m){
    var num=d.f==='entryDelay'||d.f==='exitDelay';
    m[d.f]=num?Math.max(0,parseInt(t.value,10)||0):(d.f==='color'?safeColor(t.value):t.value);
    save();refresh();return;
  }
  if(d.nf&&m){
    m.notify=m.notify||{};var n=m.notify[d.lv]=m.notify[d.lv]||{on:false,target:'',repeat:0,msg:''};
    n[d.nf]=d.nf==='on'?t.checked:d.nf==='repeat'?Math.max(0,parseInt(t.value,10)||0):t.value;
    save();return;
  }
  if(d.haid!==undefined){
    model.cfg.ids=model.cfg.ids||{};
    if(t.value.trim())model.cfg.ids[d.haid]=slug(t.value);else delete model.cfg.ids[d.haid];
    save();renderConfig();return;
  }
  if(d.haexp!==undefined){model.cfg.expose=model.cfg.expose||{};model.cfg.expose[d.haexp]=t.checked;save();renderConfig();return}
  if(t.id==='fPrefix'){model.cfg.prefix=slug(t.value)||'sentinel';save();renderConfig()}
}

/* ---------- orchestration ---------- */
function setView(v){
  ui.view=v;
  var watch=v==='watch',edit=v==='edit',cfg=!watch&&!edit;
  $('#scene').hidden=!watch;$('#editor').hidden=!edit;$('#config').hidden=!cfg;
  $('#ovFloors').hidden=!watch;$('#legend').hidden=!watch;document.querySelector('.ov.br').hidden=!watch;
  $('#view').classList.toggle('editing',!watch);
  document.querySelector('.main').classList.toggle('wide',cfg);
  ui.sel=null;
  if(edit){if(ui.floor!=='all')ui.editFloor=ui.floor;renderEditor()}
  else if(cfg)renderConfig();
  else{resize();build()}
  renderHeader();renderSide();
}
function refresh(){
  renderHeader();renderSide();renderOverlays();
  if(ui.view==='watch')build();else if(ui.view==='edit')renderEditor();else renderConfig();
}

document.addEventListener('click',function(ev){
  var t=ev.target.closest('button');if(!t)return;
  if(t.dataset.view){setView(t.dataset.view);return}
  if(t.dataset.walls){ui.solidWalls=!ui.solidWalls;renderOverlays();build();return}
  if(t.dataset.sec){ui.cfgCol[t.dataset.sec]=!ui.cfgCol[t.dataset.sec];renderConfig();return}
  if(t.dataset.msel){ui.modeSel=t.dataset.msel;renderConfig();return}
  if(t.dataset.mtab){ui.modeTab=t.dataset.mtab;renderConfig();return}
  if(t.dataset.lvview){ui.lvView=t.dataset.lvview;renderConfig();return}
  if(t.dataset.lset!==undefined){
    var lm=modeById(t.dataset.mid),sc=t.dataset.scope,k=t.dataset.key,v=t.dataset.lset;
    if(lm){
      if(sc==='def')lm.def=v;
      else{lm[sc]=lm[sc]||{};if(lm[sc][k]===v)delete lm[sc][k];else lm[sc][k]=v}
      save();refresh();
    }
    return;
  }
  if(t.dataset.cact){cfgAction(t.dataset);return}
  if(t.dataset.arm&&HA){
    model.mode=t.dataset.arm;renderHeader();API.setMode(t.dataset.arm);return;
  }
  if(t.dataset.arm){
    model.mode=t.dataset.arm;
    logEvent('Mode « '+curMode().name+' » activé','');
    save();refresh();return;
  }
  if(t.dataset.floor&&!t.closest('#editor')){
    if(ui.view==='watch')ui.floor=t.dataset.floor;
    else if(t.dataset.floor!=='all'){ui.editFloor=t.dataset.floor;ui.sel=null;renderEditor()}
    renderSide();renderOverlays();if(ui.view==='watch')build();return;
  }
  if(t.dataset.room){ui.sel={kind:'room',id:t.dataset.room};renderSide();if(ui.view==='watch')build();else{
    var r=model.rooms.find(function(x){return x.id===t.dataset.room});if(r)ui.editFloor=r.floor;renderEditor()}return}
  if(t.dataset.ent){
    if(ui.view==='watch')toggle(t.dataset.ent);
    else{var e=model.ents.find(function(x){return x.id===t.dataset.ent});ui.sel={kind:'ent',id:e.id};ui.editFloor=e.floor;renderEditor();renderSide()}
  }
});
$('#config').addEventListener('change',function(ev){cfgChange(ev.target)});
$('#config').addEventListener('input',function(ev){
  if(ev.target.id==='lvFilter'){
    ui.lvFilter=ev.target.value;
    var q=ui.lvFilter.trim().toLowerCase();
    document.querySelectorAll('#config .lrow[data-name]').forEach(function(r){r.hidden=q&&r.dataset.name.toLowerCase().indexOf(q)<0});
    return;
  }
  if(ev.target.id!=='mxFilter')return;
  var q=ev.target.value.trim().toLowerCase();
  document.querySelectorAll('#config .mx tr[data-name]').forEach(function(tr){tr.hidden=q&&tr.dataset.name.indexOf(q)<0});
});
$('#explode').addEventListener('input',function(ev){ui.explode=parseFloat(ev.target.value);build()});

function themeChanged(){build()}
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',themeChanged);
new MutationObserver(themeChanged).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

initScene();
bindEditor();
if(!HA){
  logEvent('Mode démo · '+model.ents.length+' capteurs, '+model.rooms.length+' pièces, '+model.modes.length+' modes','');
  logEvent('Mode « '+curMode().name+' » actif','');
  model.ents.filter(function(e){return e.on&&levelInfo(e).level!=='off'}).forEach(function(e){
    var t=triggerNote(e);logEvent(describe(e)+' : '+stateText(e),t.lv,t.note);
  });
  var tag=document.createElement('span');tag.className='tag';tag.textContent='Démo';
  document.querySelector('.brand').appendChild(tag);
}
API.onSnapshot=function(snap){
  live=snap;
  if(snap.mode_id&&modeById(snap.mode_id))model.mode=snap.mode_id;
  model.ents.forEach(function(e){var x=snap.ents[e.id];e.on=!!(x&&x.on)});
  lastTrigger=snap.last_trigger||null;
  journal=(snap.journal||[]).slice();
  renderLog();renderHeader();renderSide();
  if(ui.view==='watch')build();
  else if(ui.view==='ha'&&!$('#config').contains(document.activeElement))renderConfig();
};
setView('watch');
renderOverlays();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){if(ui.view==='watch')build()});
}

/* ---------- démarrage ---------- */
API.waitHass().then(function(h){
  if(!h){sentinelMain(null,false);return}
  API.load().then(function(r){
    sentinelMain(r.config,true);
    API.subscribe(function(snap){if(API.onSnapshot)API.onSnapshot(snap)});
  }).catch(function(err){
    document.body.innerHTML='<p style="padding:24px">Sentinel : configuration illisible ('+((err&&err.message)||err)+').</p>';
  });
});
</script>

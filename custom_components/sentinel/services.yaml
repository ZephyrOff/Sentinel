set_mode:
  name: Changer de mode
  description: Active un mode Sentinel par son nom ou son identifiant.
  fields:
    mode:
      name: Mode
      description: Nom (par exemple « Absence ») ou identifiant du mode.
      required: true
      example: "Absence"
      selector:
        text:

acknowledge:
  name: Acquitter
  description: Coupe les notifications répétées et efface les déclenchements mémorisés. Avec une entité, n'acquitte que celle-ci (détection en cours ou déclenchée) jusqu'à son retour à la normale.
  fields:
    entity_id:
      name: Entité
      description: Entité Home Assistant surveillée par Sentinel (ou identifiant Sentinel). Vide pour tout acquitter.
      example: binary_sensor.fenetre_salon
      required: false
      selector:
        text:

reset_counters:
  name: Réinitialiser les compteurs
  description: Remet à zéro le compteur cumulé et le dernier déclenchement.
